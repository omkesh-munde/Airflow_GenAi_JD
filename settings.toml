[paths]
logs_dir = "./logs"
sample_logs_dir = "./sample_logs"
value_doc_path = "./VALUE_PROPOSITION.md"
chroma_persist_dir = "./data/chroma"

[pipeline]
name = "Airflow Log AI Analyzer"
version = "2.0"
description = "Watches Airflow task logs, classifies 15 error types, routes to specialist agents with RAG memory."
environment = "local"
airflow_version = "2.8+"
dag_id = "log_ai_pipeline"
executor = "CeleryExecutor"

[llm]
# Supported providers: openai | anthropic | google | ollama | groq | azure | huggingface
provider = "openai"
model = "gpt-4o-mini"
temperature = 0
max_retries = 3
retry_backoff_s = 1.5
# Optional: name of a custom env var holding the LLM key (leave empty to use provider defaults)
api_key_env = ""

[embeddings]
# Supported providers: openai | ollama | google | huggingface
provider = "openai"
model = "text-embedding-3-small"
api_key_env = ""

[rag]
enabled = true
top_k = 3
min_similarity = 0.0

[web]
enabled = true
host = "127.0.0.1"
port = 8080

[openai]
api_key = ""

[anthropic]
api_key = ""

[google]
api_key = ""

[groq]
api_key = ""

[azure]
api_key = ""
endpoint = ""
deployment = ""

[ollama]
base_url = "http://localhost:11434"
